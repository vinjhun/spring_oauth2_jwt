server:
  port: 8082

spring:
  application:
    name: common-service
  datasource:
    url: ${COMMON_DB_URL:jdbc:h2:mem:commondb;MODE=Oracle;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${COMMON_DB_USERNAME:sa}
    password: ${COMMON_DB_PASSWORD:}
    driver-class-name: ${COMMON_DB_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER:http://localhost:9000}
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:9000/.well-known/jwks.json}

management:
  endpoints:
    web:
      exposure:
        include: health,info

