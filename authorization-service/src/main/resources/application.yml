server:
  port: 9000

spring:
  application:
    name: authorization-service
  datasource:
    url: ${AUTH_DB_URL:jdbc:h2:mem:authdb;MODE=Oracle;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${AUTH_DB_USERNAME:sa}
    password: ${AUTH_DB_PASSWORD:}
    driver-class-name: ${AUTH_DB_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  h2:
    console:
      enabled: false

cms:
  jwt:
    key-id: ${JWT_KEY_ID:cms-key-1}
    key-alias: ${JWT_KEY_ALIAS:cms-jwt}
    issuer: ${JWT_ISSUER:http://localhost:9000}
    pass-phrase: ${JWT_KEYSTORE_PASSWORD:changeit}
    access-token-life-time-ms: ${JWT_ACCESS_TOKEN_LIFETIME_MS:900000}
    refresh-token-life-time-ms: ${JWT_REFRESH_TOKEN_LIFETIME_MS:604800000}

management:
  endpoints:
    web:
      exposure:
        include: health,info

