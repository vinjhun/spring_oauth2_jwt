server:
  port: 8080
  servlet:
    session:
      cookie:
        name: CMS_BFF_SESSION
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:true}
        same-site: lax

spring:
  application:
    name: bff-gateway-service
  security:
    oauth2:
      client:
        registration:
          cms-bff:
            provider: cms-auth
            client-id: ${BFF_CLIENT_ID:cms-bff}
            client-secret: ${BFF_CLIENT_SECRET:cms-bff-secret}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid,profile,cms.read,cms.write,common.read,common.write
        provider:
          cms-auth:
            issuer-uri: ${AUTH_ISSUER:http://localhost:9000}
  session:
    store-type: ${SESSION_STORE_TYPE:none}
    redis:
      namespace: cms:bff:sessions
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

services:
  cms-resource-service:
    url: ${CMS_RESOURCE_SERVICE_URL:http://localhost:8081}
  common-service:
    url: ${COMMON_SERVICE_URL:http://localhost:8082}

bff:
  frontend-url: ${BFF_FRONTEND_URL:http://localhost:5173/}

management:
  health:
    redis:
      enabled: ${REDIS_HEALTH_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info
